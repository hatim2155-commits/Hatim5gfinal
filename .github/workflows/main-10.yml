name: HATIM5G Android Build (Manual Only)

# Manual trigger only: uploading/changing files never starts a build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP into workspace root
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' ! -name '*-artifact.zip' -print)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Keep exactly one project ZIP in the repository root; found ${#zips[@]}."
            printf '%s\n' "${zips[@]:-}"
            exit 1
          fi
          ZIP_FILE="${zips[0]}"
          echo "Using project archive: $(basename "$ZIP_FILE")"
          EXTRACT_DIR="$RUNNER_TEMP/hatim5g-extract"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"
          SPEC="$(find "$EXTRACT_DIR" -type f -name 'buildozer.spec' -print -quit)"
          if [ -z "$SPEC" ]; then
            echo "::error::ZIP does not contain buildozer.spec."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SPEC")"
          for required in android_main.py requirements-dev.txt .github/actions/buildozer-apk/action.yml assets/AL-Mohanad.ttf; do
            if [ ! -f "$PROJECT_DIR/$required" ]; then
              echo "::error::Required project file missing: $required"
              exit 1
            fi
          done
          cp -a "$PROJECT_DIR/." "$GITHUB_WORKSPACE/"
          test -f "$GITHUB_WORKSPACE/buildozer.spec"
          echo "Project extracted and required files verified."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt "kivy==2.3.0"

      - name: Python syntax check (headless-safe)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import pathlib, py_compile, sys
          excluded = {'.git', '.github', '.venv', 'venv', 'build', 'dist', '__pycache__'}
          files = [p for p in pathlib.Path('.').rglob('*.py')
                   if not any(part in excluded for part in p.parts)]
          if not files:
              raise SystemExit('No Python files found to syntax-check.')
          errors = []
          for path in files:
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  errors.append((path, exc))
          for path, exc in errors:
              print(f'SYNTAX ERROR: {path}: {exc}')
          print(f'Checked {len(files)} Python files; syntax errors: {len(errors)}')
          raise SystemExit(bool(errors))
          PYCODE

      - name: Build Android debug APK
        uses: ./.github/actions/buildozer-apk
        with:
          buildozer-version: '1.5.0'
          mode: debug
          cache-prefix: hatim5g-manual-v3

      - name: Verify APK and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build-android/bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No APK found in build-android/bin."
            exit 1
          fi
          cp "$APK" HATIM5G-debug.apk
          sha256sum HATIM5G-debug.apk > HATIM5G-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HATIM5G-Android-APK
          path: |
            HATIM5G-debug.apk
            HATIM5G-debug.apk.sha256
          if-no-files-found: error
