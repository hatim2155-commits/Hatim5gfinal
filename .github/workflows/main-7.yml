name: HATIM5G Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository (ZIP + workflow)
        uses: actions/checkout@v4

      - name: Extract project ZIP into workspace root
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' ! -name '*-artifact.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::لم أجد ملف ZIP للمشروع في جذر المستودع. ارفع ملف المشروع ZIP بجانب مجلد .github."
            exit 1
          fi
          echo "Using project archive: $(basename "$ZIP_FILE")"
          EXTRACT_DIR="$RUNNER_TEMP/hatim5g-extract"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"
          PROJECT_DIR="$(find "$EXTRACT_DIR" -type f -name 'requirements-dev.txt' -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/buildozer.spec" ]; then
            echo "::error::ملف ZIP لا يحتوي على requirements-dev.txt و buildozer.spec في مجلد المشروع نفسه."
            find "$EXTRACT_DIR" -maxdepth 3 -type f | head -80
            exit 1
          fi
          # نسخ محتويات مجلد المشروع إلى جذر مساحة العمل حتى تعمل المسارات
          # الموجودة في المشروع والإجراءات المحلية دون الحاجة لترتيب يدوي.
          cp -a "$PROJECT_DIR/." "$GITHUB_WORKSPACE/"
          test -f "$GITHUB_WORKSPACE/requirements-dev.txt"
          test -f "$GITHUB_WORKSPACE/.github/actions/buildozer-apk/action.yml"
          echo "Project extracted and staged at repository root."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install system packages for UI tests
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libegl1 libmtdev1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt "kivy==2.3.0"

      - name: Run tests
        run: xvfb-run -a pytest -q

      - name: Build Android debug APK
        uses: ./.github/actions/buildozer-apk
        with:
          buildozer-version: '1.5.0'
          mode: debug
          cache-prefix: hatim5g-zip-v1

      - name: Verify and upload APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build-android/bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::لم يتم العثور على APK داخل build-android/bin."
            exit 1
          fi
          cp "$APK" HATIM5G-debug.apk
          sha256sum HATIM5G-debug.apk > HATIM5G-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HATIM5G-Android-APK
          path: |
            HATIM5G-debug.apk
            HATIM5G-debug.apk.sha256
          if-no-files-found: error
