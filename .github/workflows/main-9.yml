name: HATIM5G Android Build (Manual Only)

# Deliberately manual: uploading/changing files will NOT start a build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository (ZIP + workflow)
        uses: actions/checkout@v4

      - name: Extract project ZIP into workspace root
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' ! -name '*-artifact.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No project ZIP found in the repository root. Upload the project ZIP beside .github."
            exit 1
          fi
          echo "Using project archive: $(basename "$ZIP_FILE")"
          EXTRACT_DIR="$RUNNER_TEMP/hatim5g-extract"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"
          PROJECT_DIR="$(find "$EXTRACT_DIR" -type f -name 'buildozer.spec' -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/requirements-dev.txt" ]; then
            echo "::error::ZIP must contain buildozer.spec and requirements-dev.txt in the project directory."
            find "$EXTRACT_DIR" -maxdepth 4 -type f | head -100 || true
            exit 1
          fi
          cp -a "$PROJECT_DIR/." "$GITHUB_WORKSPACE/"
          test -f "$GITHUB_WORKSPACE/buildozer.spec"
          test -f "$GITHUB_WORKSPACE/requirements-dev.txt"
          test -f "$GITHUB_WORKSPACE/.github/actions/buildozer-apk/action.yml"
          echo "Project extracted successfully."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt "kivy==2.3.0"

      # Avoid running pytest/Kivy graphical tests on the headless runner because
      # they previously crashed with SIGSEGV (exit 139). Keep a non-GUI syntax check.
      - name: Python syntax check (no GUI tests)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, py_compile, sys
          roots = [pathlib.Path('.')]
          excluded = {'.git', '.github', '.venv', 'venv', 'build', 'dist', '__pycache__'}
          files = []
          for root in roots:
              for path in root.rglob('*.py'):
                  if any(part in excluded for part in path.parts):
                      continue
                  files.append(path)
          if not files:
              print('No Python files found to syntax-check.')
              sys.exit(1)
          failed = []
          for path in files:
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failed.append((path, exc))
          for path, exc in failed:
              print(f'SYNTAX ERROR: {path}: {exc}')
          print(f'Checked {len(files)} Python files; syntax errors: {len(failed)}')
          sys.exit(1 if failed else 0)
          PY

      - name: Build Android debug APK
        uses: ./.github/actions/buildozer-apk
        with:
          buildozer-version: '1.5.0'
          mode: debug
          cache-prefix: hatim5g-manual-v2

      - name: Verify APK and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build-android/bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No APK found in build-android/bin."
            exit 1
          fi
          cp "$APK" HATIM5G-debug.apk
          sha256sum HATIM5G-debug.apk > HATIM5G-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HATIM5G-Android-APK
          path: |
            HATIM5G-debug.apk
            HATIM5G-debug.apk.sha256
          if-no-files-found: error
