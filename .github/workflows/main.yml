
name: Build HATIM5G APK from ZIP

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: "ZIP file uploaded to repository root"
        required: true
        default: "HATIM5G-GitHub-APK-Build.zip"
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP source
        shell: bash
        run: |
          set -e
          ZIP_FILE="${{ inputs.source_zip }}"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP not found: $ZIP_FILE"
            echo "Upload the ZIP file to the repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          ANDROID_SETTINGS="$(find extracted -type f \
            -path '*/android/settings.gradle' -print -quit)"

          if [ -z "$ANDROID_SETTINGS" ]; then
            echo "No Android project found in the ZIP."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          ANDROID_DIR="$(dirname "$ANDROID_SETTINGS")"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Found Android project: $ANDROID_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p "$ANDROID_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HATIM5G-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
