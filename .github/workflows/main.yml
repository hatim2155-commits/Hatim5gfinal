name: Build HATIM5G APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HATIM5G-Hua4GMon-Arabic-Logo.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip \
            python3-pip python3-venv \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev automake

      - name: Extract source
        run: |
          test -f HATIM5G-Hua4GMon-Arabic-Logo.zip
          mkdir source
          unzip -q HATIM5G-Hua4GMon-Arabic-Logo.zip -d source

      - name: Find project
        run: |
          SPEC="$(find source -type f -name buildozer.spec -print -quit)"
          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SPEC")" >> "$GITHUB_ENV"

      - name: Install Buildozer
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install buildozer setuptools "Cython==0.29.34"

      - name: Build APK
        run: |
          . .venv/bin/activate
          cd "$PROJECT_DIR"
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HATIM5G-debug-apk
          path: source/**/bin/*.apk
          if-no-files-found: error
          retention-days: 7
