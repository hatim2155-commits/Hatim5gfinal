name: HATIM5G Android Build (Manual Only)

# Manual trigger only: uploading/changing files never starts a build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and validate project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' ! -name '*-artifact.zip' -print)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Keep exactly one project ZIP in the repository root; found ${#zips[@]}."
            exit 1
          fi
          extract="$RUNNER_TEMP/hatim5g-extract"
          mkdir -p "$extract"
          unzip -q "${zips[0]}" -d "$extract"
          spec="$(find "$extract" -type f -name buildozer.spec -print -quit)"
          if [ -z "$spec" ]; then
            echo "::error::Project ZIP has no buildozer.spec."
            exit 1
          fi
          project="$(dirname "$spec")"
          for f in android_main.py requirements-dev.txt core/router.py assets/AL-Mohanad.ttf .github/actions/buildozer-apk/action.yml; do
            if [ ! -f "$project/$f" ]; then
              echo "::error::Missing required project file: $f"
              exit 1
            fi
          done
          cp -a "$project/." "$GITHUB_WORKSPACE/"
          echo "Project extracted and required files validated."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt "kivy==2.3.0"

      - name: Python syntax check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, py_compile
          excluded = {'.git', '.github', '.venv', 'venv', 'build', 'dist', '__pycache__'}
          files = [p for p in pathlib.Path('.').rglob('*.py') if not any(x in excluded for x in p.parts)]
          if not files:
              raise SystemExit('No Python files found.')
          errors = []
          for p in files:
              try:
                  py_compile.compile(str(p), doraise=True)
              except Exception as exc:
                  errors.append((p, exc))
          for p, exc in errors:
              print(f'SYNTAX ERROR: {p}: {exc}')
          print(f'Checked {len(files)} Python files; errors: {len(errors)}')
          if errors:
              raise SystemExit(1)
          PY

      - name: Build Android debug APK
        uses: ./.github/actions/buildozer-apk
        with:
          buildozer-version: '1.5.0'
          mode: debug
          cache-prefix: hatim5g-manual-v3

      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build-android/bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::No APK found in build-android/bin."
            exit 1
          fi
          cp "$apk" HATIM5G-debug.apk
          sha256sum HATIM5G-debug.apk > HATIM5G-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HATIM5G-Android-APK
          path: |
            HATIM5G-debug.apk
            HATIM5G-debug.apk.sha256
          if-no-files-found: error
